name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Generate resume PDF
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 30); do curl -sf http://localhost:4321/ >/dev/null && break; sleep 1; done
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=5000 \
            --print-to-pdf=dist/Alexandru-Neamtu-Resume.pdf http://localhost:4321/
          test -s dist/Alexandru-Neamtu-Resume.pdf
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
